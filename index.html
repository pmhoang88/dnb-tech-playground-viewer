<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>d&b Tech Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f12; }
  #app { width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: fixed; left: 0; right: 0; pointer-events: none;
    color: #e8e8ea; font: 13px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  #title { top: 18px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  #hint { bottom: 14px; font-size: 11px; letter-spacing: .08em; opacity: .45; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9a9da3; font: 13px -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .1em; background: #0d0f12; transition: opacity .5s;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title">d&amp;b Tech Playground</div>
<div class="hud" id="hint">kéo để xoay &middot; cuộn / pinch để zoom</div>
<div id="loading">ĐANG TẢI MÔ HÌNH&hellip;</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 0.1;

scene.add(new THREE.HemisphereLight(0xffffff, 0x33404d, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1, 1.6, 0.8);
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe3ff, 0.6);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

new GLTFLoader().load('model.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) * 1.5;

  controls.target.copy(center);
  camera.position.set(center.x + dist * 0.7, center.y + dist * 0.55, center.z + dist * 0.7);
  camera.near = dist / 1000;
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  controls.maxDistance = dist * 4;

  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 600);
}, undefined, () => {
  document.getElementById('loading').textContent = 'KHÔNG TẢI ĐƯỢC MÔ HÌNH';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
