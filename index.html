<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>d&b Tech Playground · Hanoi 2026</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f12; }
  #app { width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: fixed; left: 0; right: 0; pointer-events: none;
    color: #e8e8ea; font: 13px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  #title { top: 18px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  #hint { bottom: 14px; font-size: 11px; letter-spacing: .08em; opacity: .45; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9a9da3; font: 13px -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .1em; background: #0d0f12; transition: opacity .5s; z-index: 50;
  }
  #tools { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 10; }
  #layers {
    position: fixed; top: 52px; right: 14px; width: 215px; max-height: 62vh; overflow-y: auto;
    background: rgba(18,20,24,.92); border: 1px solid #3a3d42; border-radius: 10px;
    padding: 10px 12px; display: none; z-index: 20; backdrop-filter: blur(8px);
    font: 12px/1.9 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #cfd2d6;
  }
  #layers.open { display: block; }
  #layers .lr { display: flex; align-items: center; gap: 8px; white-space: nowrap; cursor: pointer; }
  #layers .lr input { accent-color: #4a83f1; margin: 0; }
  #layers .lhead { font-size: 10px; letter-spacing: .12em; opacity: .5; text-transform: uppercase; margin-bottom: 4px; }
  .btn {
    pointer-events: auto; cursor: pointer; user-select: none;
    background: rgba(28,30,34,.85); color: #d7d9dd; border: 1px solid #3a3d42;
    border-radius: 8px; padding: 7px 12px;
    font: 12px/1 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: .04em;
    backdrop-filter: blur(6px);
  }
  .btn:hover { background: rgba(50,53,60,.9); color: #fff; }
  .btn.on { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .btn.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  .btn.primary:hover { background: #4a83f1; }

  /* area-select overlay */
  #sel { position: fixed; inset: 0; cursor: crosshair; z-index: 60; background: rgba(0,0,0,.25); }
  #selBox { position: fixed; border: 1.5px dashed #4a83f1; background: rgba(74,131,241,.12); display: none; }
  .sel-tip {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    color: #cfd2d6; font: 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: rgba(20,22,25,.85); padding: 8px 14px; border-radius: 8px; letter-spacing: .04em;
  }

  /* annotation editor */
  #anno { position: fixed; inset: 0; z-index: 70; background: #07080a; display: flex; flex-direction: column; }
  #annoBar {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    padding: 12px; flex-wrap: wrap;
  }
  #annoBar .sep { width: 1px; height: 20px; background: #3a3d42; margin: 0 4px; }
  .sw {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; outline: 1px solid #3a3d42;
  }
  .sw.on { border-color: #fff; }
  #annoStage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #annoWrap { position: relative; box-shadow: 0 0 0 1px #2a2d31; }
  #annoImg, #annoDraw { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #annoDraw { touch-action: none; }
  #annoTexts { position: absolute; inset: 0; pointer-events: none; }
  .note {
    position: absolute; pointer-events: auto; cursor: grab;
    min-width: 40px; padding: 5px 8px; white-space: pre;
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    outline: 1px dashed rgba(255,255,255,.35); border-radius: 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .note:focus { outline: 1.5px solid #4a83f1; cursor: text; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title">d&amp;b Tech Playground &middot; Hanoi 2026</div>
<div class="hud" id="hint">drag to orbit &middot; right-drag / two-finger / arrow keys to pan &middot; scroll / pinch to zoom</div>
<div id="tools">
  <div class="btn" id="shotFull">Screenshot</div>
  <div class="btn" id="shotArea">Select area</div>
  <div class="btn" id="layersBtn">Layers</div>
</div>
<div id="layers"><div class="lhead">Layers</div></div>
<div id="loading">LOADING MODEL&hellip;</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.screenSpacePanning = true;
controls.listenToKeyEvents(window);
controls.minDistance = 0.1;

scene.add(new THREE.HemisphereLight(0xffffff, 0x33404d, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1, 1.6, 0.8);
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe3ff, 0.6);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(new DRACOLoader()
  .setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/'));
gltfLoader.load('model.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  buildLayers(model);

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) * 1.5;

  controls.target.copy(center);
  camera.position.set(center.x + dist * 0.7, center.y + dist * 0.55, center.z + dist * 0.7);
  camera.near = dist / 1000;
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  controls.maxDistance = dist * 4;

  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 600);
}, undefined, () => {
  document.getElementById('loading').textContent = 'FAILED TO LOAD MODEL';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

window.__dbg = { THREE, scene, camera, controls, renderer };

/* ---------- layers (SketchUp tags) ---------- */

// tag names as in the .skp file; groups hidden in the saved SketchUp view stay off by default
const LAYER_TAGS = ['10_Floors','11_Ballroom_Carpet','20_Ballroom_Walls','20b_Ballroom_Doors','21_Gold_Band','21b_Wall_Panels','22_Partition_Tracks','23_Stage_End','24_Ballroom_Ceiling','25_Light_Bar','26_AV_Speakers','30_Service','40_Side_Foyer','41_SF_Ceiling','42_Shelf','50_Foyer_Walls','51_Foyer_Openings','53_Foyer_Ceiling','54_Foyer_Columns','60_Meeting_Walls','61_Song_Da','61_Song_Thao','61_Song_Lo','65_Restrooms','70_Stairwell','80_Furniture','90_Labels','FUR_Banquet_Thao','FUR_Lounge','FUR_Tables_Classroom','FUR_Chairs_Classroom','Furniture','G&H gulv','TP_Studio1','TP_Stations','TP_Loa','TP_Bar','TP_Truss','TP_Loi_Vao','TP_Zones','TP_San','TP_Vai_Den','FOH','CabinetsSUBArray','CabinetsMainArray','Frames','CabinetsMainArray_R','Frames_R','CabinetsMainArray_L','Frames_L'];
const LAYERS_DEFAULT_OFF = new Set(['11_Ballroom_Carpet','22_Partition_Tracks','23_Stage_End','24_Ballroom_Ceiling','25_Light_Bar','41_SF_Ceiling','53_Foyer_Ceiling','90_Labels','FUR_Tables_Classroom','FUR_Chairs_Classroom']);
const _norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function buildLayers(model) {
  const tagNorm = LAYER_TAGS.map(t => ({ name: t, n: _norm(t) }))
    .sort((a, b) => b.n.length - a.n.length);
  const claimed = new Map(); // tag name -> Set(node)

  (function walk(o, underClaim) {
    const nm = _norm(o.name);
    const tag = !underClaim && nm.length >= 3 &&
      tagNorm.find(t => nm === t.n || nm.startsWith(t.n));
    if (tag) {
      if (!claimed.has(tag.name)) claimed.set(tag.name, new Set());
      claimed.get(tag.name).add(o);
      underClaim = true;
    }
    o.children.forEach(c => walk(c, underClaim));
  })(model, false);

  const panel = document.getElementById('layers');
  const tris = o => { let t = 0; o.traverse(m => { if (m.isMesh && m.geometry?.index) t += m.geometry.index.count / 3; }); return t; };

  for (const tag of LAYER_TAGS) {
    const nodes = claimed.get(tag);
    if (!nodes || ![...nodes].some(n => tris(n) > 0)) continue;
    const on = !LAYERS_DEFAULT_OFF.has(tag);
    const row = document.createElement('label');
    row.className = 'lr';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = on;
    cb.onchange = () => nodes.forEach(n => n.visible = cb.checked);
    row.append(cb, document.createTextNode(tag));
    panel.appendChild(row);
    if (!on) nodes.forEach(n => n.visible = false);
  }
}
document.getElementById('layersBtn').onclick = () =>
  document.getElementById('layers').classList.toggle('open');

/* ---------- screenshot ---------- */

const el = (tag, id) => { const e = document.createElement(tag); if (id) e.id = id; return e; };
const PR = () => renderer.getPixelRatio();

function snap() {
  renderer.render(scene, camera);
  const c = el('canvas');
  c.width = renderer.domElement.width;
  c.height = renderer.domElement.height;
  c.getContext('2d').drawImage(renderer.domElement, 0, 0);
  return c;
}

document.getElementById('shotFull').onclick = () => openAnnotator(snap());
document.getElementById('shotArea').onclick = () => {
  const ov = el('div', 'sel');
  ov.innerHTML = '<div class="sel-tip">Drag to select an area &middot; Esc to cancel</div>';
  const box = el('div', 'selBox');
  ov.appendChild(box);
  document.body.appendChild(ov);

  let x0, y0, x1, y1, drag = false;
  const upd = () => box.style.cssText =
    `display:block;left:${Math.min(x0,x1)}px;top:${Math.min(y0,y1)}px;` +
    `width:${Math.abs(x1-x0)}px;height:${Math.abs(y1-y0)}px`;
  ov.onpointerdown = e => {
    x0 = x1 = e.clientX; y0 = y1 = e.clientY; drag = true;
    ov.setPointerCapture(e.pointerId); upd();
  };
  ov.onpointermove = e => { if (drag) { x1 = e.clientX; y1 = e.clientY; upd(); } };
  ov.onpointerup = () => {
    if (!drag) return;
    ov.remove(); removeEventListener('keydown', esc);
    const x = Math.min(x0,x1), y = Math.min(y0,y1), w = Math.abs(x1-x0), h = Math.abs(y1-y0);
    if (w < 10 || h < 10) return;
    const full = snap(), c = el('canvas'), pr = PR();
    c.width = Math.round(w * pr); c.height = Math.round(h * pr);
    c.getContext('2d').drawImage(full, x*pr, y*pr, c.width, c.height, 0, 0, c.width, c.height);
    openAnnotator(c);
  };
  const esc = e => { if (e.key === 'Escape') { ov.remove(); removeEventListener('keydown', esc); } };
  addEventListener('keydown', esc);
};

/* ---------- annotation editor ---------- */

const COLORS = ['#ff453a', '#ffd60a', '#32d74b', '#0a84ff', '#ffffff', '#000000'];
const FONT_CSS = '16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
const FONT_PX = 16, PAD_X = 8, PAD_Y = 5, LINE = 1.35;

function openAnnotator(src) {
  const ov = el('div', 'anno');
  const stage = el('div', 'annoStage');
  const wrap = el('div', 'annoWrap');
  const imgC = el('canvas', 'annoImg');
  const drawC = el('canvas', 'annoDraw');
  const texts = el('div', 'annoTexts');
  const bar = el('div', 'annoBar');

  const fit = Math.min((innerWidth - 60) / src.width, (innerHeight - 110) / src.height, 1);
  const dw = Math.round(src.width * fit), dh = Math.round(src.height * fit);
  const k = src.width / dw; // css px -> device px

  wrap.style.width = dw + 'px'; wrap.style.height = dh + 'px';
  imgC.width = drawC.width = src.width;
  imgC.height = drawC.height = src.height;
  imgC.getContext('2d').drawImage(src, 0, 0);
  const dctx = drawC.getContext('2d');
  dctx.setTransform(k, 0, 0, k, 0, 0);
  dctx.lineCap = dctx.lineJoin = 'round';

  wrap.append(imgC, drawC, texts);
  stage.appendChild(wrap);
  ov.append(bar, stage);
  document.body.appendChild(ov);

  let mode = 'pen', color = COLORS[0], drawing = false, stroke = null;
  const history = []; // {type:'stroke',data} | {type:'note',el}

  const bPen = mkBtn('Pen', () => setMode('pen'));
  const bText = mkBtn('Text', () => setMode('text'));
  const bUndo = mkBtn('Undo', undo);
  const bSave = mkBtn('Save PNG', save, 'primary');
  const bClose = mkBtn('Close', () => ov.remove());
  const sws = COLORS.map((c, i) => {
    const s = el('div'); s.className = 'sw' + (i === 0 ? ' on' : '');
    s.style.background = c;
    s.onclick = () => { color = c; sws.forEach(x => x.classList.remove('on')); s.classList.add('on');
      const n = document.activeElement; if (n?.classList?.contains('note')) n.style.color = c; };
    return s;
  });
  bar.append(bPen, bText, sep(), ...sws, sep(), bUndo, sep(), bSave, bClose);
  function mkBtn(t, fn, cls) { const b = el('div'); b.className = 'btn ' + (cls||''); b.textContent = t; b.onclick = fn; return b; }
  function sep() { const s = el('div'); s.className = 'sep'; return s; }
  function setMode(m) { mode = m; bPen.classList.toggle('on', m === 'pen'); bText.classList.toggle('on', m === 'text');
    drawC.style.cursor = m === 'pen' ? 'crosshair' : 'text'; }
  setMode('pen');

  const pos = e => {
    const r = drawC.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };

  function replay() {
    dctx.clearRect(0, 0, drawC.width, drawC.height);
    for (const h of history) if (h.type === 'stroke') paint(h.data);
  }
  function paint(s) {
    dctx.strokeStyle = s.color; dctx.lineWidth = s.w;
    dctx.beginPath();
    s.pts.forEach(([x, y], i) => i ? dctx.lineTo(x, y) : dctx.moveTo(x, y));
    dctx.stroke();
  }

  drawC.onpointerdown = e => {
    if (mode === 'text') { addNote(...pos(e)); return; }
    drawing = true; stroke = { color, w: 2.5, pts: [pos(e)] };
    drawC.setPointerCapture(e.pointerId);
    paint(stroke);
  };
  drawC.onpointermove = e => {
    if (!drawing) return;
    stroke.pts.push(pos(e)); paint(stroke);
  };
  drawC.onpointerup = () => {
    if (!drawing) return;
    drawing = false; history.push({ type: 'stroke', data: stroke }); stroke = null;
  };

  function addNote(x, y) {
    const n = el('div'); n.className = 'note';
    n.style.left = x + 'px'; n.style.top = y + 'px';
    n.style.color = color; n.style.font = FONT_CSS;
    texts.appendChild(n);
    history.push({ type: 'note', el: n });

    let sx, sy, ox, oy, moved;
    n.onpointerdown = e => {
      if (e.target !== n) return;
      sx = e.clientX; sy = e.clientY; ox = n.offsetLeft; oy = n.offsetTop; moved = false;
      n.setPointerCapture(e.pointerId);
    };
    n.onpointermove = e => {
      if (sx === undefined) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 4) {
        moved = true; n.blur(); n.contentEditable = 'false';
      }
      if (moved) {
        n.style.left = Math.max(0, Math.min(ox + e.clientX - sx, dw - 20)) + 'px';
        n.style.top = Math.max(0, Math.min(oy + e.clientY - sy, dh - 20)) + 'px';
      }
    };
    n.onpointerup = () => {
      if (sx === undefined) return;
      sx = undefined;
      if (!moved) {
        n.contentEditable = 'true'; n.focus();
        const r = document.createRange(); r.selectNodeContents(n); r.collapse(false);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      }
    };
    n.onblur = () => { n.contentEditable = 'false'; if (!n.innerText.trim()) remove(n); };
    n.onpaste = e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); };
    n.onkeydown = e => { if (e.key === 'Escape') n.blur(); e.stopPropagation(); };

    n.contentEditable = 'true'; n.focus();
  }

  function remove(n) {
    const i = history.findIndex(h => h.el === n);
    if (i >= 0) history.splice(i, 1);
    n.remove();
  }
  function undo() {
    const h = history.pop();
    if (!h) return;
    if (h.type === 'note') h.el.remove(); else replay();
  }
  function save() {
    const out = el('canvas'); out.width = src.width; out.height = src.height;
    const c = out.getContext('2d');
    c.drawImage(src, 0, 0);
    c.drawImage(drawC, 0, 0);
    c.font = `${FONT_PX * k}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
    c.textBaseline = 'middle';
    for (const h of history) {
      if (h.type !== 'note') continue;
      const n = h.el;
      c.fillStyle = getComputedStyle(n).color;
      n.innerText.split('\n').forEach((line, i) => {
        const x = (n.offsetLeft + PAD_X) * k;
        const y = (n.offsetTop + PAD_Y + (i + 0.5) * FONT_PX * LINE) * k;
        c.fillText(line, x, y);
      });
    }
    out.toBlob(b => {
      const a = el('a'), t = new Date();
      a.href = URL.createObjectURL(b);
      a.download = `screenshot-${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}-` +
                   `${String(t.getHours()).padStart(2,'0')}${String(t.getMinutes()).padStart(2,'0')}${String(t.getSeconds()).padStart(2,'0')}.png`;
      a.click(); URL.revokeObjectURL(a.href);
      bSave.textContent = 'Saved'; setTimeout(() => bSave.textContent = 'Save PNG', 1500);
    });
  }

  const esc = e => {
    if (e.key !== 'Escape') return;
    if (document.activeElement?.classList?.contains('note')) document.activeElement.blur();
    else { ov.remove(); removeEventListener('keydown', esc); }
  };
  addEventListener('keydown', esc);
}
</script>
</body>
</html>
